<svg viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustrasjon av fjorden og landet i Asker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Himmel -->
  <rect x="0" y="0" width="1600" height="420" fill="#E6F1FB"/>

  <!-- Sol / lys sirkel bak i horisonten -->
  <circle cx="1230" cy="150" r="95" fill="#FBF4E3"/>

  <!-- Fjerne åser (Hurumlandet, disig i det fjerne) -->
  <path d="M0,210 Q120,165 260,195 T560,185 T860,200 T1160,180 T1600,195 L1600,420 L0,420 Z" fill="#B4B2A9" opacity="0.5"/>

  <!-- Midtre landmasse -->
  <path d="M0,260 Q160,205 340,235 Q520,265 700,225 Q880,190 1080,230 Q1260,265 1440,220 Q1520,205 1600,235 L1600,420 L0,420 Z" fill="#6BA02A"/>

  <!-- Nærmere ås, mørkere grønn -->
  <path d="M0,300 Q220,255 420,285 Q600,310 820,270 Q1040,235 1260,280 Q1420,310 1600,270 L1600,420 L0,420 Z" fill="#3B6D11"/>

  <!-- Fjorden -->
  <path d="M0,335 Q220,310 440,330 Q660,350 880,320 Q1100,295 1320,325 Q1460,342 1600,315 L1600,420 L0,420 Z" fill="#378ADD"/>

  <!-- Lyse vannlinjer -->
  <path d="M0,335 Q220,310 440,330 Q660,350 880,320 Q1100,295 1320,325 Q1460,342 1600,315" fill="none" stroke="#85B7EB" stroke-width="3" opacity="0.75"/>
  <path d="M40,365 Q260,345 480,362 Q700,380 920,355 Q1140,332 1360,358 Q1480,372 1600,350" fill="none" stroke="#85B7EB" stroke-width="2" opacity="0.5"/>

  <!-- Liten seilbåt -->
  <g transform="translate(1000,300)">
    <path d="M0,40 L60,40 L48,52 L12,52 Z" fill="#173404"/>
    <line x1="30" y1="8" x2="30" y2="40" stroke="#173404" stroke-width="2"/>
    <path d="M30,10 L30,38 L54,38 Z" fill="#F5F5F0"/>
  </g>

  <!-- Fugler -->
  <path d="M180,90 q10,-10 20,0 q10,-10 20,0" fill="none" stroke="#5F5E5A" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230,70 q8,-8 16,0 q8,-8 16,0" fill="none" stroke="#5F5E5A" stroke-width="2.5" stroke-linecap="round"/>

</svg>
